version: "3.8"

services:
  # Dedicated Application PostgreSQL Database
  # NOTE: Strictly for portal users, sessions, RBAC, and metadata.
  # Do NOT point to or mix with the bank_dwh_real database.
  app-db:
    image: postgres:16-alpine
    container_name: banking_portal_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banking_portal_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured in environment}
    ports:
      # Maps container port 5432 to host port 5433 to avoid conflict with existing local PostgreSQL
      - "${PORTAL_DB_PORT:-5433}:5432"
    volumes:
      - portal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-banking_portal_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: banking_portal_backend
    restart: unless-stopped
    depends_on:
      app-db:
        condition: service_healthy
    environment:
      APP_NAME: "${APP_NAME:-Banking Analytics Portal}"
      APP_ENV: "${APP_ENV:-development}"
      DEBUG: "${DEBUG:-true}"
      # Internal Docker network connection using service hostname 'app-db' and port 5432
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@app-db:5432/${POSTGRES_DB:-banking_portal_db}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-[\"http://localhost:3000\",\"http://127.0.0.1:3000\"]}"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be configured in environment}"
      CSRF_SECRET_KEY: "${CSRF_SECRET_KEY:?CSRF_SECRET_KEY must be configured in environment}"
      FIRST_SUPERUSER_EMAIL: "${FIRST_SUPERUSER_EMAIL:?FIRST_SUPERUSER_EMAIL must be configured in environment}"
      FIRST_SUPERUSER_PASSWORD: "${FIRST_SUPERUSER_PASSWORD:?FIRST_SUPERUSER_PASSWORD must be configured in environment}"
      FIRST_SUPERUSER_FULL_NAME: "${FIRST_SUPERUSER_FULL_NAME:-System Administrator}"
      # Superset integration (optional until configured with real credentials)
      SUPERSET_BASE_URL: "${SUPERSET_BASE_URL:-http://host.docker.internal:8088}"
      SUPERSET_BROWSER_URL: "${SUPERSET_BROWSER_URL:-http://localhost:8088}"
      SUPERSET_ADMIN_USERNAME: "${SUPERSET_ADMIN_USERNAME:-}"
      SUPERSET_ADMIN_PASSWORD: "${SUPERSET_ADMIN_PASSWORD:-}"
    ports:
      - "8000:8000"

  # Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: banking_portal_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
    ports:
      - "3000:3000"

volumes:
  portal_pgdata:
    driver: local
